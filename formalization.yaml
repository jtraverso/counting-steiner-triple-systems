status:
  scope: >-
    All numbered results of Wilson's paper are proved (Theorem 1; Theorems 2 and 3, with their
    van der Waerden parts both as implications from the vdWPC hypothesis and unconditionally;
    Theorem 4; Lemmas 3–5 and inequality (2.1)), Theorems 1.1 and 1.2 of Linial–Luria with
    explicit error terms, and the van der Waerden permanent theorem. Theorem 3 carries the harmless extra hypothesis ε < 3^{-3/2} e^{-2} (the paper takes ε
    small). Linial–Luria's Conjecture 1.3 (open) and Keevash's proof of Wilson's conjecture are
    not stated as theorems.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "autonomous"
      models: ["Aristotle (Harmonic)"]
      framework: "Aristotle CLI and web"
      tool_setup: >-
        From the PDFs of the two papers, Aristotle formalized Wilson's paper and then Linial–Luria
        on top of it, first checking the finite computations with native_decide. At the author's
        request it then replaced every native_decide by kernel-checked certificates with verified
        checkers (bit-encoded Latin-square states with a symmetry reduction; pair-coverage
        bitmasks for explicit systems), split into files of at most a few hundred lines, and fixed
        the port to the pinned toolchain. For version 2, Aristotle proved the van der Waerden
        permanent theorem on the pinned toolchain, following a suggested route (Gurvits's proof
        as simplified by Laurent–Schrijver).
      cost:
        wall_time: "about one day of runs"
        spend_usd: "not tracked"
        hardware: "API-only"
      prompting_notes: "The papers' PDFs and natural-language instructions."
    - method: "agent"
      models: ["Claude Opus 5.5"]
      framework: "Claude Code (Anthropic)"
      tool_setup: >-
        Audit of the definitions and statements against the papers, identity checks of the main
        statements across Aristotle's versions, migration of the Linial–Luria part to the pinned
        toolchain, splitting the order-8 certificate into one kernel check per job (to bound
        memory), a sequential memory-controlled local build, and the Palomar packaging, checked
        with `lake build`, `#print axioms` and a comparison of the elaborated Challenge and
        Solution declarations (Lean v4.35.0-rc3, Mathlib
        c55e6e786f49471c72fbddbec5415808896aec1e).
      cost:
        wall_time: "about one day"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: "Natural-language instructions in Spanish, directed by the author."
  spend_usd: "subscription-based"
  notes: >-
    The papers were chosen by the human author; the Lean proofs are AI-generated and mechanically
    verified (no `sorry`, no native_decide, axioms limited to propext, Classical.choice and
    Quot.sound, identical elaborated types for the Challenge/Solution pair).

fidelity:
  divergences: >-
    STS are families of 3-element Finsets of Fin v; N(v) is the cardinality of the quotient by
    point permutations. F(n) counts proper (n−1)-edge-colourings of K_n, that is, ordered
    1-factorizations; this is at least the number of unordered 1-factorizations, so the upper
    bound of Theorem 1.2 implies the paper's. The van der Waerden permanent conjecture appears
    as the hypothesis vdWPC (permanent of a doubly stochastic n×n matrix ≥ n!/n^n) of
    theorem2_vdW and theorem3_vdW, as in Wilson's paper; van_der_waerden proves it, and
    theorem2_full and theorem3_full are the unconditional versions. The proof of
    van_der_waerden avoids Hurwitz's theorem by a closed monotonicity condition characterizing
    stability, and treats matrices with zero entries by a limit argument. Theorem 3 has the
    extra hypothesis ε < 3^{-3/2} e^{-2}. Lemma 4, which Wilson cites from Doyen–Wilson, is proved
    here from the recursive construction and explicit systems.

review:
  status: "agent-reviewed"
  reviewers:
    - "Claude Opus 5.5 (AI agent in Claude Code, acting for the author)"
  notes: >-
    Agent review by Claude Opus 5.5, distinct from the mechanical verification: the agent
    compared every definition and main statement with the two papers, checked that the main
    statements are identical across Aristotle's successive versions, and confirmed by a full
    local `lake build`, `#print axioms` and a comparison of the fully elaborated Challenge and
    Solution declarations that the proofs use no `sorry` and only propext, Classical.choice and
    Quot.sound. The author directed the work. No independent human mathematical review has been
    performed. The results are published; no mathematical novelty is claimed.

